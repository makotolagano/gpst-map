<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>GPST RX Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --ok: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --chip: #f1f5f9;
    --shadow: 0 -4px 20px rgba(15, 23, 42, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1120;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #1f2937;
      --accent: #60a5fa;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --chip: #1f2937;
      --shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1120; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2937;
    --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #1f2937;
    --shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1000;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
  .conn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .conn[data-state="connected"] .dot { background: var(--ok); }
  .conn[data-state="connecting"] .dot { background: var(--warn); }
  .conn[data-state="lost"] .dot { background: var(--bad); }
  .conn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--chip); color: var(--text);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #map { flex: 1; min-height: 0; background: var(--line); }
  #panel {
    background: var(--panel); box-shadow: var(--shadow); z-index: 1000;
    padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    max-height: 48vh; overflow-y: auto;
  }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
  .tabs:empty { display: none; }
  .tab { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .tab .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .headline { display: flex; align-items: center; gap: 14px; }
  .arrow { width: 56px; height: 56px; flex: none; transition: transform 0.4s ease; }
  .dist { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 13px; }
  .age[data-stale="true"] { color: var(--bad); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin-top: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 3px 9px; }
  .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .empty { color: var(--muted); padding: 6px 0; }
  .empty b { color: var(--text); }
  #log {
    position: fixed; inset: auto 8px 8px 8px; max-height: 40vh; z-index: 2000; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px 10px; overflow-y: auto;
  }
  #log.open { display: block; }
  #log div { white-space: pre-wrap; overflow-wrap: anywhere; }
  #log .err { color: var(--bad); }
  #toast {
    position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 3000; display: none;
    background: var(--bad); color: #fff; padding: 8px 14px; border-radius: 8px; max-width: calc(100% - 32px);
    font-size: 14px;
  }
  #demo { display: none; background: var(--warn); color: #111; font-size: 12px; text-align: center; padding: 2px; }
  .me-dot { width: 16px; height: 16px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 1px #2563eb; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
<div id="demo">Demo mode: simulated data</div>
<header>
  <h1>GPST</h1>
  <div class="conn" id="conn" data-state="idle"><span class="dot"></span><span id="connText">Not connected</span></div>
  <div class="spacer"></div>
  <button class="primary" id="btnConnect">Connect</button>
</header>
<div id="map" role="application" aria-label="Map"></div>
<section id="panel" aria-live="polite">
  <div class="tabs" id="tabs"></div>
  <div id="details"></div>
  <div class="actions">
    <button id="btnFollow" aria-pressed="true">Follow</button>
    <button id="btnMe">My position</button>
    <button id="btnGpx">Save GPX</button>
    <button id="btnClear">Clear track</button>
    <button id="btnLog" aria-pressed="false">Log</button>
  </div>
</section>
<div id="log" aria-label="Received lines"></div>
<div id="toast" role="alert"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
